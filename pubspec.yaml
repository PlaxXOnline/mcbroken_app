name: mcbroken
description: A new Flutter project.

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  bloc: ^8.0.3
  flutter_bloc: ^8.0.1
  connectivity_plus: ^2.2.1
  go_router: ^3.0.6
  flutter_map: ^8.1.1
  http: ^1.1.0
  latlong2: ^0.9.0
  flutter_map_marker_cluster_plus: ^1.4.2
  geolocator: ^14.0.0
  intl: ^0.19.0
  flutter_native_splash: ^2.2.16
  google_fonts: ^6.1.0
  flutter_map_location_marker: ^10.1.0
  equatable: ^2.0.5
  settings_ui: ^2.0.2
  flutter_map_cancellable_tile_provider: ^3.1.0
  # Neu hinzugefügt für Performance-Optimierung (Phase 1)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_cache_manager: ^3.3.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  json_annotation: ^4.8.1
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.9.2

  flutter_lints: ^1.0.0


flutter_icons:
  android: true
  ios: true
  image_path_android: "assets/icons/mcbroken_icon_1024.png"
  image_path_ios: "assets/icons/mcbroken_icon_1024.png"

flutter_native_splash:
  color: "#2197f2"
  image: assets/mcbroken_big_text.png


flutter:


  uses-material-design: true
  generate: true

  assets:
    - assets/